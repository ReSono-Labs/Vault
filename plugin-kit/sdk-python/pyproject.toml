[project]
name = "resono-vault-plugin-sdk"
version = "0.1.0"
description = "Optional helpers for ReSono Labs Vault MCP plugins"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
