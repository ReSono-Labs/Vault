worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    map $http_x_forwarded_host $forwarded_host {
        default $http_x_forwarded_host;
        "" $http_host;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" https;
    }

    server {
        listen 8766;
        server_name _;

        location / {
            proxy_pass https://vault:8765;
            proxy_http_version 1.1;

            proxy_ssl_server_name on;
            # Vault's generated certificate always includes the localhost DNS SAN.
            # Nginx's upstream verifier handles this consistently across OpenSSL
            # versions, unlike an IP literal supplied through proxy_ssl_name.
            proxy_ssl_name localhost;
            proxy_ssl_trusted_certificate /vault-data/tls/vault-local-ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 1;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $forwarded_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
            # Preserve the browser-facing scheme so Vault can keep cookies
            # usable on this loopback-only HTTP compatibility endpoint.
            proxy_set_header X-ReSono-External-Scheme $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;
            proxy_buffering off;
        }
    }
}
