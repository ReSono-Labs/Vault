[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "resono-vault-hermes-memory"
version = "0.1.0"
description = "Hermes MemoryProvider for a scoped local ReSono Vault"
requires-python = ">=3.11"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
dependencies = []

[project.entry-points."hermes_agent.memory_providers"]
resono-vault = "resono_vault_hermes:register"

[project.scripts]
resono-vault-memory-pair = "resono_vault_hermes.pairing:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resono_vault_hermes = ["plugin.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
