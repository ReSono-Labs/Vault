# Vault CI: public-tree check, full Python suite on the isolated test database, adapter tests, frontend checks.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-tree:
    name: Public tree (no local paths or maintainer records)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 scripts/check_public_tree.py

  python:
    name: Python suite (isolated test database)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The isolated test database from compose.test.yml; tests/conftest.py refuses any other URL.
      VAULT_TEST_DATABASE_URL: postgresql://vault_test:vault_test_only@127.0.0.1:55436/resono_vault_test
      # A missing database fails the run instead of skipping every integration test.
      VAULT_REQUIRE_INTEGRATION: "1"
      PGOPTIONS: -c lock_timeout=3000 -c statement_timeout=15000
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Tools the runtime image installs (Dockerfile runtime stage)
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ripgrep tree jq fd-find file
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.8.14" # Same uv as the Dockerfile.
      - name: Python 3.12 (the image's interpreter) and dependencies
        run: uv sync --frozen --extra dev --python 3.12
      - name: Start the test database
        run: docker compose -f compose.test.yml up -d --wait
      - name: Run the suite
        run: uv run --frozen pytest -q -rfEsxX
      - name: Hermes adapter tests
        working-directory: integrations/hermes-vault-memory
        # test_provider.py needs a local Hermes agent checkout (HERMES_DONOR_PATH), so it runs on developer machines only.
        run: PYTHONPATH=src uv run --frozen --project ../.. python -m pytest -q tests/test_pairing_ca.py
      - name: Stop the test database
        if: always()
        run: docker compose -f compose.test.yml down --volumes

  frontend:
    name: Frontend type-check, tests and build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22" # Same major as the Dockerfile's web-build stage.
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --project tsconfig.json --noEmit
      - run: npx vitest run
      - run: npm run build
